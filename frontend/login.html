<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PocketSplit - track expenses, income and budgets in one place." />
  <meta name="theme-color" content="#6366f1" />
  <title>Login · PocketSplit</title>

  <!-- Tab icon (inline SVG, no extra file needed) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236366f1'/%3E%3Ctext x='50' y='70' font-size='62' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E" />

  <!-- Nicer font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/style.css" />

  <!-- Small design touches (kept after style.css so they apply on top) -->
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    html { scroll-behavior: smooth; }
    ::selection { background: #6366f1; color: #fff; }

    /* slim, rounded scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #a5b4fc; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }

    /* soft focus ring for inputs and buttons */
    input:focus, select:focus, button:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }

    /* gentle press effect on buttons */
    button { transition: transform .12s ease, box-shadow .12s ease; }
    button:active { transform: scale(0.97); }

    /* fade-in when the app loads */
    #root { animation: ps-fade .35s ease both; }
    @keyframes ps-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      #root { animation: none; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
