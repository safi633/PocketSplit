<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker Signup</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page active">
    <div class="glass-card">
      <div class="auth-left">
        <div class="auth-title">Create Account</div>
        <div class="auth-subtitle">Start managing your finances Today</div>
        <input class="auth-input" id="suName" type="text" placeholder="Full Name" autocomplete="name" />
        <input class="auth-input" id="suEmail" type="text" placeholder="Gmail Address" autocomplete="email" />
        <input class="auth-input" id="suUser" type="text" placeholder="Username" autocomplete="username" minlength="3" maxlength="16" />
        <input class="auth-input" id="suPass" type="password" placeholder="Password" autocomplete="new-password" />
        <button class="grad-btn" onclick="doSignup()">CREATE ACCOUNT</button>
        <div class="auth-switch">Already have an account? <a href="/login.html">Login</a></div>
      </div>
      <div class="auth-right">
        <h2>Why Expense Tracker?</h2>
        <ul>
          <li>• Track daily expenses </li>
          <li>• Manage monthly budgets</li>
          <li>• Analyze spending insights</li>
        </ul>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
